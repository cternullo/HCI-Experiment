<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Estimation Assistant Study</title>
<style>
/* ---------------------------------------------------------------
   Would You Trust Her? — Group 9, Human Centred AI
   Wizard-of-Oz experiment app. Runs fully offline in one file.
   --------------------------------------------------------------- */
:root{
  --bg:#1c1f26; --panel:#252932; --panel2:#2d323d; --line:#3a404c;
  --text:#eee9df; --muted:#9aa0ab; --accent:#f07c45; --good:#7fcf9a; --bad:#e86a6a;
  --radius:14px;
  --font: "Space Grotesk", "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:17px;line-height:1.5}
#app{max-width:860px;margin:0 auto;padding:40px 24px 80px;min-height:100%}
h1{font-size:30px;line-height:1.2;margin:0 0 12px}
h2{font-size:22px;margin:0 0 12px}
p{margin:0 0 14px}
.muted{color:var(--muted)}
.small{font-size:14px}
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:28px;margin-bottom:20px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 22px;cursor:pointer;background:var(--accent);color:#1c1f26}
button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
button.danger{background:var(--bad);color:#1c1f26}
button:disabled,button.secondary:disabled,button.danger:disabled{background:var(--panel2);color:var(--muted);border:1px dashed var(--line);cursor:not-allowed}
input[type=number],input[type=text],textarea,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;width:100%}
input[type=number]{font-family:var(--mono);font-size:22px;max-width:220px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
textarea{min-height:110px;resize:vertical}
label.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
label.check input{margin-top:5px;width:18px;height:18px;accent-color:var(--accent)}
.field{margin:18px 0}
.field > .lbl{display:block;font-weight:600;margin-bottom:8px}
/* Likert */
.likert{display:flex;gap:8px;margin:10px 0 4px}
.likert button{flex:1;background:var(--panel2);color:var(--text);border:1px solid var(--line);padding:14px 0;font-family:var(--mono);font-size:18px}
.likert button.sel{background:var(--accent);color:#1c1f26;border-color:var(--accent)}
.likert-ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.opts{display:grid;gap:8px}
.opts button{background:var(--panel2);color:var(--text);border:1px solid var(--line);text-align:left;font-weight:500}
.opts button.sel{border-color:var(--accent);outline:2px solid var(--accent)}
/* Assistant */
.agent-head{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.agent-name{font-family:var(--mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.agent-name::before{content:"● ";}
.bubble{background:var(--panel2);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:16px 18px;font-size:19px;max-width:560px}
.typing span{display:inline-block;width:8px;height:8px;margin:0 3px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.stimulus{display:flex;justify-content:center;background:#f4efe6;border-radius:var(--radius);padding:10px}
.stimulus svg,.stimulus img{max-width:100%;height:auto;display:block}
.stimulus img{max-height:44vh;width:auto;border-radius:8px}
.stimulus.small{flex:0 0 auto;max-width:42%}
.stimulus.small img{max-height:30vh}
.card > .stimulus{margin-bottom:18px}
.withthumb{display:flex;gap:22px;align-items:flex-start;justify-content:space-between;margin-bottom:18px}
.withthumb > .qa{flex:1;min-width:0}
@media (max-width:700px){.withthumb{flex-direction:column-reverse}.stimulus.small{max-width:100%}}
.unit{font-family:var(--mono);color:var(--muted)}
.bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:12px}
.bar > div{height:100%;background:var(--accent);width:100%;transition-property:width;transition-timing-function:linear}
.mine{font-family:var(--mono);color:var(--muted);margin:6px 0 16px}
.progress{font-family:var(--mono);font-size:13px;color:var(--muted)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:700px){.pair{grid-template-columns:1fr}}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
code,.mono{font-family:var(--mono)}
.pill{display:inline-block;font-family:var(--mono);font-size:12px;padding:2px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
.notice{border-left:3px solid var(--accent);padding:10px 14px;background:var(--panel2);border-radius:6px;margin:12px 0}
.hidden{display:none!important}
.err{color:var(--bad);font-size:14px;min-height:20px}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =================================================================
   CONFIG — everything the group may want to change lives here.
   ================================================================= */
const CONFIG = {
  STUDY_VERSION: "v2.2",   // saved with every session; v1.2 = names only (no avatars); v1.3 = 11-word confident line + Google Sheet backup; v2.0 = 8 real-world estimation items instead of 4 dot images; v2.1 = 6 items (kettle and Dublin–Galway removed); v2.2 = station picker on first load, each station starts on a different condition
  /* Hypotheses (slides v3) and the CSV columns that test them:
       H1a / H2a / H3a  -> Weight of Advice, from initial, advice, final (computed as woa)
       H1b / H2b / H3b  -> trust (1–7 rating after every trial)
       H1 = confidence (within), H2 = assistant Eve/Adam (between), H3 = their interaction.
     Participants never see these: the hypothesis guess is asked before any check that hints at them. */
  // Stations: one per researcher laptop. The researcher picks theirs on the first screen.
  // Each station starts on a different condition (see assignmentList). Add names if you like,
  // e.g. { id: "A", label: "Cole" }. Keep ids short (letters/digits): they start every participant ID.
  STATIONS: [
    { id: "A", label: "Station A" },
    { id: "B", label: "Station B" },
    { id: "C", label: "Station C" },
    { id: "D", label: "Station D" },
    { id: "E", label: "Station E" }
  ],
  ADVICE_DELAY_MS: 2000,        // "2 s wait" before advice appears (same in all conditions)
  EXPOSURE_MS: 0,               // 0 = the photo stays on screen while the participant answers; e.g. 6000 = show it for 6 s, then hide it
  ADVICE_OFFSET: 0.10,          // advice is a fixed 10% from the truth
  SLOTS_TO_GENERATE: 200,       // length of the pre-shuffled assignment list per station
  CONTACT: "a member of Group 9 (Human Centred AI)",   // shown on consent/debrief for withdrawal

  // Optional: Google Apps Script web-app URL to send each finished session to a Google Sheet.
  // Leave "" to store only on this computer (export CSV from the experimenter panel).
  SUBMIT_URL: "",

  ASSISTANTS: {
    Eve:  { name: "Eve",  gender: "female" },
    Adam: { name: "Adam", gender: "male" }
  },

  // Matched at 11 words each. {n} is replaced by the advised number.
  PHRASES: {
    confident: "I’m certain the answer is {n}. This is my best estimate.",
    hedged:    "I think it’s probably around {n}, but I’m not completely sure."
  },
  CHECK_NUMBER: 450,   // number used in the end-of-study confidence manipulation check

  /* Items: 2 counting, 2 weight, 1 time, 1 distance. Sources and verified answers are in
     stimulus-sources/SOURCES.md. I5 (kettle) and I7 (Dublin–Galway) were removed in v2.1;
     the other IDs are unchanged so data stays comparable.
     Confidence alternates down the list: item set 1 makes list positions 1, 3, 5 (I1, I3, I6)
     confident and 2, 4, 6 (I2, I4, I8) hedged; item set 2 swaps them. So each confidence level
     gets one counting, one weight, and one time-or-distance item. With 3 items per level the
     above/below split can't be even: in set 1, confident is 1 above + 2 below and hedged is
     2 above + 1 below; set 2 reverses this, so it balances out across item sets.
     adviceDir: +1 = advice 10% above truth, -1 = 10% below.
     type "image": src is a photo in the images/ folder next to this HTML.
     type "text":  question only, no picture.
     type "dots":  generated dot image (needs seed and color; not used at the moment).
     unit is shown next to the answer box. Keep an even number of items. */
  ITEMS: [
    { id: "I1", type: "image", src: "images/q1-jellybeans.jpg", truth: 1623, adviceDir: +1, unit: "sweets",
      question: "How many sweets are in this jar?" },
    { id: "I2", type: "image", src: "images/q2-crowd.jpg", truth: 1454, adviceDir: -1, unit: "people",
      question: "How many people are in this photo?" },
    { id: "I3", type: "image", src: "images/q3-apples.jpg", truth: 983, adviceDir: -1, unit: "grams",
      question: "How much do these apples weigh, in grams?" },
    { id: "I4", type: "image", src: "images/q4-laptop.jpg", truth: 1240, adviceDir: +1, unit: "grams",
      question: "How much does this laptop weigh, in grams?" },
    { id: "I6", type: "text", truth: 62, adviceDir: -1, unit: "minutes",
      question: "According to Google Maps, how many minutes does it take to walk from UCD to St Stephen’s Green?" },
    { id: "I8", type: "text", truth: 782, adviceDir: +1, unit: "km",
      question: "What’s the straight-line distance from Dublin to Paris, in km?" }
  ]
};

/* =================================================================
   Utilities
   ================================================================= */
const $ = (sel, el = document) => el.querySelector(sel);
const app = document.getElementById("app");
const now = () => Date.now();
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s){ let h = 2166136261; for (const c of s){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function shuffle(arr, rnd){ const a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } }
};
const K = { data: "wyth_sessions_v1", station: "wyth_station", slot: s => "wyth_nextslot_" + s };
let storageOK = (() => { try { localStorage.setItem("_t","1"); localStorage.removeItem("_t"); return true; } catch(e){ return false; } })();

/* =================================================================
   Balanced, pre-shuffled assignment list
   Conditions are shuffled within blocks of 4, so after every 4
   completed participants each Eve/Adam x set 1/2 cell has one person.
   ================================================================= */
const CONDITIONS = [
  { assistant: "Eve",  itemSet: 1 }, { assistant: "Eve",  itemSet: 2 },
  { assistant: "Adam", itemSet: 1 }, { assistant: "Adam", itemSet: 2 }
];
/* Staggered starts: the first block of 4 at each station is a different row of a
   balanced Latin square, so station A, B, C and D each start on a different condition
   and run the 4 conditions in a different order. Later blocks are shuffled per station.
   There are only 4 conditions, so a 5th station must share a starting condition with
   one of A–D: station E starts like B but runs the block in a different order. */
const FIRST_BLOCKS = [[0, 1, 3, 2], [1, 2, 0, 3], [2, 3, 1, 0], [3, 0, 2, 1], [1, 3, 2, 0]];
function stationIndex(st){
  const i = CONFIG.STATIONS.findIndex(x => x.id === st);
  return i >= 0 ? i : hashStr(st) % FIRST_BLOCKS.length;
}
function assignmentList(station){
  const rnd = mulberry32(hashStr("group9-" + station));
  const out = FIRST_BLOCKS[stationIndex(station) % FIRST_BLOCKS.length].map(k => CONDITIONS[k]);
  while (out.length < CONFIG.SLOTS_TO_GENERATE) out.push(...shuffle(CONDITIONS, rnd));
  return out;
}
const stationChosen = () => store.get(K.station, null) !== null;
const station = () => store.get(K.station, "A");
const stationLabel = st => (CONFIG.STATIONS.find(x => x.id === st) || { label: "Station " + st }).label;
const nextSlot = () => store.get(K.slot(station()), 1);

/* =================================================================
   Stimuli: photos (images/ folder) and deterministic dot images
   ================================================================= */
function dotsSVG(item){
  const W = 620, H = 400, r = 6, minD = 15, pad = 14;
  const rnd = mulberry32(item.seed);
  const pts = [];
  let guard = 0;
  while (pts.length < item.truth && guard < 200000){
    guard++;
    const x = pad + rnd() * (W - 2 * pad), y = pad + rnd() * (H - 2 * pad);
    if (pts.every(p => (p[0] - x) ** 2 + (p[1] - y) ** 2 >= minD * minD)) pts.push([x, y]);
  }
  if (pts.length !== item.truth) console.error("Could not place all dots for", item.id);
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Image with dots">
    <rect width="${W}" height="${H}" fill="#f4efe6"/>
    ${pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${r}" fill="${item.color}"/>`).join("")}
  </svg>`;
}
function stimulusHTML(item){
  if (item.type === "image") return `<img src="${esc(item.src)}" alt="">`;
  return dotsSVG(item);
}
const itemOf = t => CONFIG.ITEMS.find(x => x.id === t.item_id);
const hasPicture = item => item.type === "image" || item.type === "dots";
// Timed mode (EXPOSURE_MS > 0): the picture is shown for a few seconds, then hidden.
const timedExposure = item => hasPicture(item) && CONFIG.EXPOSURE_MS > 0;
// Otherwise the picture stays on screen next to the question.
const pictureHTML = (item, small) => hasPicture(item) && !timedExposure(item)
  ? `<div class="stimulus${small ? " small" : ""}">${stimulusHTML(item)}</div>` : "";

/* The photos are separate files. Load them up front (so they show instantly) and
   warn the researcher on the home screen if any of them is missing. */
let missingImages = [];
function imageWarnHTML(){
  return missingImages.length ? `<div class="notice">⚠ Missing photo${missingImages.length > 1 ? "s" : ""}: <span class="mono">${missingImages.map(esc).join(", ")}</span>. Copy the whole <span class="mono">experiment</span> folder (this file <b>and</b> its <span class="mono">images</span> folder), then reload.</div>` : "";
}
function checkImages(){
  const srcs = CONFIG.ITEMS.filter(it => it.type === "image").map(it => it.src);
  Promise.all(srcs.map(src => new Promise(res => {
    const im = new Image(); im.onload = () => res(null); im.onerror = () => res(src); im.src = src;
  }))).then(r => {
    missingImages = r.filter(Boolean);
    const el = document.getElementById("imgwarn"); if (el) el.innerHTML = imageWarnHTML();
  });
}
const adviceFor = item => Math.round(item.truth * (1 + CONFIG.ADVICE_OFFSET * item.adviceDir));

/* =================================================================
   Session state
   ================================================================= */
let S = null;   // current participant session
let timers = [];
function clearTimers(){ timers.forEach(t => clearTimeout(t)); timers = []; }

function newSession(){
  const st = station(), slot = nextSlot();
  const cond = assignmentList(st)[(slot - 1) % CONFIG.SLOTS_TO_GENERATE];
  // Item set 1: list positions 1, 3, 5 confident and 2, 4, 6 hedged; item set 2 swaps them.
  const plan = CONFIG.ITEMS.map((it, i) => ({
    item: it,
    confidence: (cond.itemSet === 1) === (i % 2 === 0) ? "confident" : "hedged"
  }));
  // Trial order is randomised per participant so confidence is not confounded with position.
  const order = shuffle(plan, Math.random);
  const rand = Math.random().toString(36).slice(2, 4).toUpperCase();
  S = {
    pid: `${st}${String(slot).padStart(3, "0")}-${rand}`,
    station: st, slot, assistant: cond.assistant,
    ai_gender: CONFIG.ASSISTANTS[cond.assistant].gender,
    item_set: cond.itemSet, version: CONFIG.STUDY_VERSION,
    started_at: new Date().toISOString(), completed_at: null,
    consent: false, withdrawn: false,
    trials: order.map((p, idx) => ({
      position: idx + 1, item_id: p.item.id, confidence: p.confidence,
      truth: p.item.truth, advice: adviceFor(p.item),
      initial: null, final: null, trust: null,
      rt_initial_ms: null, rt_final_ms: null, rt_trust_ms: null
    })),
    checks: {}
  };
}
const A = () => CONFIG.ASSISTANTS[S.assistant];

/* =================================================================
   Screens
   ================================================================= */
function render(html){ clearTimers(); app.innerHTML = html; window.scrollTo(0, 0); }

/* ---------- Experimenter home ---------- */
function screenHome(){
  S = null;
  if (!stationChosen()) return screenStationPicker();
  const sessions = store.get(K.data, []);
  const done = sessions.filter(s => s.completed_at && !s.withdrawn).length;
  const slot = nextSlot();
  render(`
    <div class="kicker">Experimenter screen · do not show participants</div>
    <h1>Ready for the next participant</h1>
    ${storageOK ? "" : `<div class="notice">⚠ This browser is blocking local storage, so data will not be saved. Open this file directly in Chrome/Firefox/Edge (not inside a preview window).</div>`}
    <div id="imgwarn">${imageWarnHTML()}</div>
    <div class="card">
      <div class="row">
        <div>${stationLabel(station()) === "Station " + station() ? "Station" : esc(stationLabel(station())) + " · station"} <span class="pill">${esc(station())}</span> · next slot <span class="pill">#${slot}</span> · completed here <span class="pill">${done}</span></div>
      </div>
      <p class="small" id="sheetstatus" style="margin:12px 0 0">${sheetStatusText()}</p>
    </div>
    <div class="row">
      <button id="go">Hand over to participant →</button>
      <div class="spacer"></div>
      <button class="secondary" id="chst">Change station</button>
      <button class="secondary" id="admin">Data &amp; settings</button>
    </div>
    <p class="muted small" style="margin-top:24px">Tip: if a participant has to stop part-way, press <span class="mono">Ctrl + Shift + X</span> to abandon the session. Abandoned or withdrawn sessions do not use up a slot, so balance is kept.</p>
  `);
  $("#go").onclick = () => { newSession(); screenConsent(); };
  $("#admin").onclick = screenAdmin;
  $("#chst").onclick = screenStationPicker;
  checkImages();
}

/* ---------- Station picker (researcher only) ---------- */
function screenStationPicker(){
  S = null;
  const sessions = store.get(K.data, []);
  const doneAt = st => sessions.filter(s => s.station === st && s.completed_at && !s.withdrawn).length;
  const current = stationChosen() ? station() : null;
  render(`
    <div class="kicker">Experimenter setup · do not show participants</div>
    <h1>Choose your station</h1>
    <p class="muted">Each researcher’s laptop must use a <b>different</b> station. Each station hands out the conditions in its own balanced order, starting from a different one, and its participant IDs start with its letter. This laptop remembers your choice.</p>
    <div class="opts" id="stlist" style="margin:20px 0">
      ${CONFIG.STATIONS.map(x => `<button type="button" data-v="${esc(x.id)}" class="${x.id === current ? "sel" : ""}">
        <span class="pill">${esc(x.id)}</span> &nbsp;${esc(x.label)}
        <span class="muted small" style="float:right">${doneAt(x.id)} completed on this laptop · next slot #${store.get(K.slot(x.id), 1)}</span></button>`).join("")}
    </div>
    <div class="row">
      <button id="ok" ${current ? "" : "disabled"}>Use this station →</button>
      ${current ? `<div class="spacer"></div><button class="secondary" id="cancel">Cancel</button>` : ""}
    </div>
    <div class="err" id="sterr"></div>
  `);
  let pick = current;
  document.querySelectorAll("#stlist button").forEach(b => b.onclick = () => {
    document.querySelectorAll("#stlist button").forEach(x => x.classList.remove("sel"));
    b.classList.add("sel"); pick = b.dataset.v; $("#ok").disabled = false;
  });
  $("#ok").onclick = () => {
    if (!pick) return;
    if (!store.set(K.station, pick)){ $("#sterr").textContent = "Could not save the station: this browser is blocking storage."; return; }
    screenHome();
  };
  $("#cancel") && ($("#cancel").onclick = screenHome);
}

/* ---------- Consent (cover story) ---------- */
function screenConsent(){
  render(`
    <div class="kicker">Study information</div>
    <h1>Testing an AI that helps with estimates</h1>
    <div class="card">
      <p>We are a student group in the Human Centred AI module. We are testing an AI assistant that helps people make quick estimates.</p>
      <p>You will answer ${CONFIG.ITEMS.length} short estimation questions, for example how many sweets are in a jar or how far apart two cities are. Some of them come with a photo. After each estimate the AI assistant will give its own answer, and you can then give a final answer and rate how much you trust the assistant.</p>
      <p>It takes about <b>10 minutes</b>. Participation is voluntary. You can stop at any time without giving a reason.</p>
      <p>We do <b>not</b> record your name, email or any personal details. Your answers are stored under a random ID. You will see this ID at the end, and you can use it to ask ${esc(CONFIG.CONTACT)} to delete your data.</p>
      <p class="muted small">Some details of the study are explained only at the end, so that they do not affect your answers. You will get a full explanation before you leave.</p>
      <label class="check" style="margin-top:18px"><input type="checkbox" id="ok"> <span>I have read this information, I am 18 or over, and I agree to take part.</span></label>
    </div>
    <div class="row"><button id="next" disabled>Continue</button><div class="spacer"></div><button class="secondary" id="no">I do not want to take part</button></div>
  `);
  $("#ok").onchange = e => $("#next").disabled = !e.target.checked;
  $("#next").onclick = () => { S.consent = true; S.consented_at = new Date().toISOString(); screenIntro(); };
  $("#no").onclick = () => { S = null; screenThanksNoData(); };
}
function screenThanksNoData(){
  render(`<div class="card"><h2>No problem — thank you.</h2><p>Nothing has been recorded. Please hand the computer back to the researcher.</p></div>
    <button class="secondary" id="back">Researcher: return</button>`);
  $("#back").onclick = screenHome;
}

/* ---------- Assistant introduction ---------- */
function screenIntro(){
  const a = A();
  render(`
    <div class="card" style="text-align:center">
      <div class="agent-name" style="margin:0 0 14px">${esc(a.name)} · AI assistant</div>
      <div class="bubble" style="margin:0 auto;text-align:left">Hi, I’m ${esc(a.name)}, your AI assistant. I’ll be helping you with some estimates today.</div>
    </div>

function saveProgress(){

  const all = store.get(K.data, []);

/* ---------- Google Sheet backup ----------
   Every finished session (and every withdrawal) goes into an "outbox" saved in
   this browser. The outbox is sent to the Google Sheet straight away, and again
   every 30 s, whenever the laptop comes back online, and when the page is opened.
   An item only leaves the outbox once the upload has gone through, so a dropped
   Wi-Fi connection never loses data. The Sheet ignores a session it already has,
   so sending one twice is harmless. */
const OUTBOX = "wyth_outbox_v1";
let flushing = false;
function submitRemote(payload){
  if (!CONFIG.SUBMIT_URL) return;
  const box = store.get(OUTBOX, []);
  box.push(JSON.parse(JSON.stringify(payload)));
  store.set(OUTBOX, box);
  flushOutbox();
}
async function flushOutbox(){
  if (!CONFIG.SUBMIT_URL || flushing) return;
  flushing = true;
  try {
    let box = store.get(OUTBOX, []);
    while (box.length){
      const item = box[0];
      try {
        // no-cors: the reply can't be read, but the request only resolves once it has reached Google.
        await fetch(CONFIG.SUBMIT_URL, { method: "POST", mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(item) });
      } catch(e){ break; }   // offline: keep it, try again later
      box = store.get(OUTBOX, []).filter(x => !(x.pid === item.pid && !!x.withdrawn === !!item.withdrawn));
      store.set(OUTBOX, box);
      store.set("wyth_last_upload", new Date().toISOString());
    }
  } finally {
    flushing = false;
    if (typeof refreshSheetStatus === "function") refreshSheetStatus();
  }
}
function resendAllToSheet(){
  if (!CONFIG.SUBMIT_URL) return 0;
  const done = store.get(K.data, []).filter(s => s.completed_at && !s.withdrawn);
  const box = store.get(OUTBOX, []);
  done.forEach(s => { if (!box.some(x => x.pid === s.pid && !x.withdrawn)) box.push(s); });
  store.set(OUTBOX, box);
  flushOutbox();
  return done.length;
}
function sheetStatusText(){
  if (!CONFIG.SUBMIT_URL) return "Google Sheet backup: <b>off</b> (no SUBMIT_URL set). Data is only on this laptop.";
  const waiting = store.get(OUTBOX, []).length, last = store.get("wyth_last_upload", null);
  return `Google Sheet backup: <b>on</b> · waiting to upload: <span class="pill">${waiting}</span>` +
    (last ? ` · last upload ${esc(last.replace("T", " ").slice(0, 16))}` : " · nothing uploaded yet") +
    (waiting ? ` <span class="muted">(will retry automatically)</span>` : "");
}
function refreshSheetStatus(){ const el = document.getElementById("sheetstatus"); if (el) el.innerHTML = sheetStatusText(); }
setInterval(flushOutbox, 30000);
window.addEventListener("online", flushOutbox);

/* Abandon current session (Ctrl+Shift+X): delete partial data, keep slot. */
document.addEventListener("keydown", e => {
  if (e.ctrlKey && e.shiftKey && (e.key === "X" || e.key === "x") && S){

  }
});

/* =================================================================
   Export
   ================================================================= */
const TRIAL_COLS = ["pid","station","slot","assistant","ai_gender","item_set","version","started_at","completed_at",
  "position","item_id","confidence","truth","advice","initial","final","trust","woa_raw","woa",
  "rt_initial_ms","rt_final_ms","rt_trust_ms",
  "hypothesis_guess","name_recall","name_correct","gender_perceived","conf_rating_confident","conf_rating_hedged","conf_check_left"];
function woa(t){
  if (t.initial == null || t.final == null || t.initial === t.advice) return [null, null];
  const raw = (t.final - t.initial) / (t.advice - t.initial);
  return [raw, Math.min(1, Math.max(0, raw))];
}
function toCSV(sessions){
  const q = v => { if (v === null || v === undefined) return ""; const s = String(v); return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const lines = [TRIAL_COLS.join(",")];
  for (const s of sessions) for (const t of s.trials){
    const [raw, capped] = woa(t);
    const row = { ...s, ...s.checks, ...t, woa_raw: raw === null ? null : +raw.toFixed(4), woa: capped === null ? null : +capped.toFixed(4) };
    lines.push(TRIAL_COLS.map(c => q(row[c])).join(","));
  }
  return lines.join("\n");
}
function download(name, text, type){
  try {
    const url = URL.createObjectURL(new Blob([text], { type }));
    const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
  } catch(e){}
}

    <div class="card">
      <h2>Test run</h2>
      <p class="muted small">Pilot the study without using a slot or saving data.</p>
      <div class="row"><button class="secondary" id="pilotE">Pilot as Eve</button><button class="secondary" id="pilotA">Pilot as Adam</button></div>
    </div>
    <div class="card">
      <h2>Clear all data</h2>
      <p class="muted small">Type <span class="mono">DELETE</span> to remove every session stored on this computer. Download a backup first.</p>
      <div class="row"><input type="text" id="clr" style="max-width:200px"><button class="danger" id="clrb">Clear</button></div>
    </div>
    <button id="back">← Back</button>
  `);
  $("#csv") && ($("#csv").onclick = () => download(`trust_study_${station()}_${new Date().toISOString().slice(0,10)}.csv`, toCSV(complete), "text/csv"));
  $("#json") && ($("#json").onclick = () => download(`trust_study_${station()}_raw.json`, JSON.stringify(all, null, 2), "application/json"));
  $("#copy") && ($("#copy").onclick = () => { const ta = $("#csvtext"); ta.value = toCSV(complete); ta.classList.remove("hidden"); ta.select(); });
  $("#save").onclick = () => {
    const sl = parseInt($("#sl").value, 10);
    if (!(sl >= 1)){ $("#saveerr").textContent = "Next slot must be 1 or more."; return; }
    store.set(K.slot(station()), sl);
    screenAdmin();
  };
  $("#del") && ($("#del").onclick = () => {
    const id = $("#delid").value.trim().toUpperCase();
    const before = store.get(K.data, []);
    const after = before.filter(s => s.pid.toUpperCase() !== id);
    if (after.length === before.length){ $("#delerr").textContent = "No session with that ID."; return; }
    store.set(K.data, after); submitRemote({ pid: id, withdrawn: true, withdrawn_at: new Date().toISOString() }); screenAdmin();
  });
  const pilot = name => {
    newSession(); S.assistant = name; S.ai_gender = CONFIG.ASSISTANTS[name].gender; S.pid = "PILOT";
    S._pilot = true; screenConsent();
  };
  $("#pilotE").onclick = () => pilot("Eve");
  $("#pilotA").onclick = () => pilot("Adam");
  $("#clrb").onclick = () => { if ($("#clr").value === "DELETE"){ store.set(K.data, []); screenAdmin(); } };
  $("#reveal").onclick = () => {
    const slot = nextSlot(), c = assignmentList(station())[(slot - 1) % CONFIG.SLOTS_TO_GENERATE];
    const el = $("#cond"), btn = $("#reveal");
    el.textContent = `Slot #${slot}: ${c.assistant}, item set ${c.itemSet}`;
    el.classList.toggle("hidden");
    btn.textContent = el.classList.contains("hidden") ? "Show condition" : "Hide condition";
  };
  $("#resend") && ($("#resend").onclick = () => { const n = resendAllToSheet(); $("#resendmsg").textContent = `Queued ${n} completed session(s) for upload.`; refreshSheetStatus(); });
  $("#retry") && ($("#retry").onclick = () => flushOutbox());
  $("#back").onclick = screenHome;
}

/* Pilot sessions never save or use a slot */
const _save = saveProgress;
saveProgress = function(){ if (S && S._pilot) return; _save(); };
const _submit = submitRemote;
submitRemote = function(p){ if (S && S._pilot) return; _submit(p); };
const _setStore = store.set;
store.set = function(k, v){ if (S && S._pilot && String(k).startsWith("wyth_nextslot_")) return true; return _setStore.call(store, k, v); };

screenHome();
flushOutbox();   // send anything left over from last time
</script>
</body>
</html>
